spring.application.name=autogestion-api
spring.profiles.default=seed

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Clave del JWT: SIEMPRE por variable de entorno (minimo 32 caracteres). No se versiona.
api.jwt.secret=${API_JWT_SECRET:}
api.jwt.ttl-minutes=15

api.uploads.dir=${API_UPLOADS_DIR:uploads}

api.login.max-attempts=5
api.login.lock-minutes=15

# Passkeys: rp-id = dominio de la API; origins = hash SHA-256 (base64url) del certificado de firma del APK
# de release y del de debug. /home persiste en App Service (Linux) entre reinicios.
api.passkeys.rp-id=${API_PASSKEY_RP_ID:autogestion-api-jc.azurewebsites.net}
api.passkeys.rp-name=Motos del Caribe
api.passkeys.origins=android:apk-key-hash:ky2K_KsLhNPee3-qt6lD8NQNmhfInLxa7mLKL7qItWc,${API_PASSKEY_EXTRA_ORIGINS:}
api.passkeys.file=${API_PASSKEYS_FILE:}

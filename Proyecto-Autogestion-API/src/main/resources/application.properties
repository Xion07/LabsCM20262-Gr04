spring.application.name=autogestion-api
spring.profiles.default=seed

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Clave del JWT: SIEMPRE por variable de entorno (minimo 32 caracteres). No se versiona.
api.jwt.secret=${API_JWT_SECRET:}
api.jwt.ttl-minutes=15

api.uploads.dir=${API_UPLOADS_DIR:uploads}

api.login.max-attempts=5
api.login.lock-minutes=15
